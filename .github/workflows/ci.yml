name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install root dependencies
        run: npm ci

      - name: Test root package (suites that currently pass)
        run: npx jest --ci --coverage=false testing/governance/compliance.test.js testing/integration/worker-lifecycle.test.js

      - name: Install api-server dependencies
        working-directory: api-server
        run: npm ci

      - name: Test api-server
        working-directory: api-server
        run: node test/apm-integration.test.js

      - name: Smoke test llm-mesh middleware
        working-directory: llm-mesh/gateway/middleware
        run: |
          npm install --no-package-lock
          node -e "require('./token-counter'); console.log('token-counter loaded')"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install python-sdk dependencies
        working-directory: python-sdk
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test python-sdk
        working-directory: python-sdk
        run: python -m pytest tests -q
